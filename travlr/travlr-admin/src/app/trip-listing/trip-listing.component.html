<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Travlr Admin &mdash; Trip Management</h2>
        <a *ngIf="authService.isLoggedIn()" class="btn btn-success" routerLink="/add-trip">+ Add Trip</a>
    </div>

    <div *ngIf="!authService.isLoggedIn()" class="alert alert-secondary">
        You are viewing trips in read-only mode. <a routerLink="/login">Log in</a> to add, edit, or delete trips.
    </div>

    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
    <div *ngIf="message && !error" class="alert alert-info">{{ message }}</div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" *ngFor="let trip of trips">
            <app-trip-card [trip]="trip" [isLoggedIn]="authService.isLoggedIn()" (deletedTrip)="onDeleteTrip($event)"></app-trip-card>
        </div>
    </div>

    <div *ngIf="trips.length === 0 && !error" class="text-center text-muted mt-5">
        <p>No trips yet. Click <strong>+ Add Trip</strong> to get started.</p>
    </div>
</div>
